spring:
  application:
    name: nuru-backend
  datasource:
    url: jdbc:sqlserver://${MSSQL_HOST:localhost}:${MSSQL_PORT:7862};databaseName=${MSSQL_DB:nuru};encrypt=true;trustServerCertificate=${MSSQL_TRUST_CERT:true}
    username: ${MSSQL_USER:sa}
    password: ${MSSQL_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true
    diskspace:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

nuru:
  jwt:
    secret: ${NURU_JWT_SECRET:change-me-to-a-long-random-local-dev-secret-32-chars-min}
    access-minutes: ${NURU_JWT_ACCESS_MINUTES:30}
    refresh-token-days: ${NURU_REFRESH_TOKEN_DAYS:14}
  ai:
    provider: ${NURU_AI_PROVIDER:}
    base-url: ${NURU_AI_BASE_URL:}
    api-key: ${NURU_AI_API_KEY:}
    model: ${NURU_AI_MODEL:}
    timeout-ms: ${NURU_AI_TIMEOUT_MS:15000}
    max-tool-steps: ${NURU_AI_MAX_TOOL_STEPS:4}
    retention-days: ${NURU_AI_RETENTION_DAYS:90}
    proposal-expiry-hours: ${NURU_AI_PROPOSAL_EXPIRY_HOURS:24}
  notifications:
    email-provider: ${NURU_EMAIL_PROVIDER:LOG}
    sms-provider: ${NURU_SMS_PROVIDER:LOG}
  identity:
    provider: ${NURU_IDV_PROVIDER:}
  credit:
    provider: ${NURU_CREDIT_PROVIDER:}
  payments:
    mode: ${NURU_PAYMENT_MODE:MANUAL}

logging:
  level:
    com.nuru: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss} [%X{correlationId:-}] %-5level %logger{36} - %msg%n"
